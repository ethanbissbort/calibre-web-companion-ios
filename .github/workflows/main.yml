name: 'Build & Release'

on:
  pull_request:
    branches:
      - main
  # Allows a release to be cut deliberately from the Actions tab instead of only
  # as a side effect of opening a pull request.
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    env:
      # The secrets context is not allowed in step-level `if:` expressions,
      # so expose presence flags for forks that don't have these secrets.
      HAS_ANDROID_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_RELEASE_TOKEN: ${{ secrets.TOKEN != '' }}

    steps:
      #1 Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #2 Setup Java
      - name: Set Up Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'temurin'
          java-version: '17'

      #3 Setup Flutter
      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'

      #4 Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      #4.5 Generate translation files
      - name: Generate Translation Files
        run: flutter gen-l10n

      #5 Setup Keystore (skipped on forks without the signing secrets).
      # Without these secrets the release build now FAILS instead of silently
      # producing a debug-signed "release" artifact - see the signing guard in
      # android/app/build.gradle.kts.
      - name: Decode Keystore
        if: ${{ env.HAS_ANDROID_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/keystore.jks

      - name: Create key.properties
        if: ${{ env.HAS_ANDROID_KEYSTORE == 'true' }}
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../keystore.jks" >> android/key.properties

      #6.0 Decide how this run signs.
      # With the keystore secrets we produce a real, publishable release. Without
      # them (the default on a fork) we opt in EXPLICITLY to debug signing so the
      # build still verifies and CI stays green - but the resulting artifacts are
      # test-only and are never attached to a release draft. The opt-in must be
      # explicit: android/app/build.gradle.kts refuses to sign a release with the
      # debug key unless asked, precisely so this can never happen by accident.
      - name: Select signing mode
        run: |
          if [ "$HAS_ANDROID_KEYSTORE" = "true" ]; then
            echo "SIGNING_ARGS=" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Building with the release keystore."
          else
            echo "SIGNING_ARGS=-PallowDebugSigning=true" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_BASE64 secret. Building DEBUG-SIGNED Android artifacts for verification only; they will not be attached to any release."
          fi

      #6.1 Build App Bundle (AAB)
      - name: Build App Bundle
        run: flutter build appbundle --release --no-tree-shake-icons $SIGNING_ARGS

      #6.2 Building APK
      - name: Build APKs (Split per ABI)
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons $SIGNING_ARGS

      #6.3 Version + previous tag (used by the release notes)
      - name: Extract version and previous tag
        id: version
        run: |
          full=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r ')
          version="${full%%+*}"
          code="${full##*+}"
          prev_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "PREV_TAG=$prev_tag" >> "$GITHUB_ENV"
          echo "Version $version (code $code), previous tag: '${prev_tag:-none}'"

      # NOTE: Do NOT add a Google Play upload step here.
      #
      # This repository is a fork. Upstream's Play listing
      # (de.doen1el.calibreWebCompanion) belongs to doen1el, and this fork must
      # never publish to, or otherwise interact with, upstream's infrastructure.
      # The previous "Upload to Google Play" step targeted exactly that package
      # name; it was only dormant because this fork has no Play credentials, and
      # adding a SERVICE_ACCOUNT_JSON secret would have silently started
      # publishing this fork's builds to upstream's app listing.
      #
      # The step and the "Generate Play Store changelogs" step that fed it (via
      # .github/scripts/generate_whatsnew.sh -> distribution/whatsnew) have been
      # removed. If this fork ever ships to Play, it needs its own applicationId
      # and its own Play Console listing first.

      #7 Upload Artifacts (APK). The name states the signing mode so a
      # debug-signed verification build can't be mistaken for a shippable one.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name:
            ${{ env.RELEASE_SIGNED == 'true' && 'Releases' ||
            'Releases-DEBUG-SIGNED-do-not-distribute' }}
          path: |
            build/app/outputs/flutter-apk/*.apk

      #8 Build the GitHub release body from the fastlane changelog and template
      - name: Build release notes
        run: |
          changelog="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          {
            echo "## v${VERSION}"
            echo
            echo "_TODO: Write a short summary of this release._"
            echo
            echo "Special thanks to:"
            echo "_TODO: @mention the contributors_"
            echo
            echo "And everyone else who created issues! ❤️"
            echo
            echo "## What's Changed"
            if [ -f "$changelog" ]; then
              # Normalise trailing newlines so the next heading renders.
              printf '%s\n' "$(cat "$changelog")"
            else
              echo "- _No changelog found for build ${VERSION_CODE}._"
            fi
            echo
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION}"
            fi
            echo "## 📥 Download"
          } > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md

      #9 Create GitHub Release (skipped on forks without a release TOKEN)
      # Debug-signed APKs must never reach a release draft: they carry the
      # public Android debug key, so they offer no authenticity guarantee and
      # cannot be upgraded by a real signed release.
      - name: Create Release Draft
        if: ${{ env.HAS_RELEASE_TOKEN == 'true' && env.RELEASE_SIGNED == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'build/app/outputs/flutter-apk/*.apk'
          tag: v${{ env.VERSION }}
          draft: true
          token: ${{ secrets.TOKEN }}
          name: 'Release v${{ env.VERSION }}'
          bodyFile: release_notes.md

  build-ios:
    name: Build iOS (Unsigned IPA)
    runs-on: macos-latest
    # Wait for the Android job so the release draft already exists before the
    # IPA is attached to it (avoids two jobs racing to create the same tag),
    # but still build the IPA when the Android job fails.
    needs: build
    if: ${{ !cancelled() }}
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.TOKEN != '' }}

    steps:
      #1 Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #2 Setup Flutter
      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'

      #3 Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      #3.5 Generate translation files
      - name: Generate Translation Files
        run: flutter gen-l10n

      #4 Build the unsigned IPA for sideloading
      - name: Build Unsigned IPA
        run: bash ios/create_unsigned_ipa.sh

      #5 Extract version (used for the release tag)
      - name: Extract version
        run: |
          full=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r ')
          version="${full%%+*}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version"

      #6 Upload Artifacts (IPA)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Releases-iOS
          path: |
            build/ios/iphoneos/*.ipa

      #7 Attach the IPA to the same release draft the Android job created
      # (skipped on forks without a release TOKEN)
      - name: Attach IPA to Release Draft
        if: ${{ env.HAS_RELEASE_TOKEN == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'build/ios/iphoneos/*.ipa'
          tag: v${{ env.VERSION }}
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true
          token: ${{ secrets.TOKEN }}
